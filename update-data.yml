name: Morgenroutine - aktuelle Werte
on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1-5"
    - cron: "45 15 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yfinance pandas requests lxml html5lib beautifulsoup4
      - run: python fetch_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json
          git diff --cached --quiet || git commit -m "Aktuelle Morgenroutine-Werte"
          git push
